# Deploys an app release to Cloudflare Workers.
#   Release: gh release create vX.Y.Z --generate-notes
#   Roll back: gh workflow run deploy.yml --ref vX.Y.Z -f tag=vX.Y.Z
# The production environment accepts only v* tags, so a rollback names the tag in --ref too. It holds the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: App release tag to deploy, such as v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Accept only an app release tag
        run: |
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Deploy takes an app release tag that starts with v, not '$TAG'."
              exit 1
              ;;
          esac

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        run: corepack enable && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned release file
        run: pnpm data:install

      - name: Build
        env:
          APP_VERSION: ${{ env.TAG }}
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.151.3 deploy

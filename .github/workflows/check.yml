name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: RXP Planner check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        run: corepack enable && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        env:
          VITEST_MAX_WORKERS: 2
          RXP_DATASET: data/fixtures/generic-dataset
        run: pnpm check --verbose

      - name: Install the pinned release file
        run: pnpm data:install

      - name: Release tests
        env:
          VITEST_MAX_WORKERS: 2
        run: pnpm test:release
